[project]
name = "causa"
version = "0.1.0"
description = "Lokální, auditovatelná platforma pro firemní rozhodování (WorkModel / FaceModel)"
requires-python = ">=3.11"
authors = [{ name = "Causa" }]
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "ollama>=0.1.0",
    "python-dotenv>=1.0.0",
    "structlog>=23.2.0",
    "python-json-logger>=2.0.0",
    "tenacity>=8.2.0",
    "jsonschema>=4.20.0",
    "aiofiles>=23.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "hypothesis>=6.100.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
eval = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

server = [
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.2.0",
]

desktop = [
    "pywebview>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: unitové testy",
    "integration: integrační testy",
    "eval: evaluační testy (zlaté případy)",
    "security: bezpečnostní testy",
    "smoke: fumée testy proti živému modelu (vyžadují Ollama)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "UP", "B"]