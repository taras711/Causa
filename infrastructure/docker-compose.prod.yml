# Produkční varianta (s pgvector, zálohami, monitoringem)
version: "3.8"

services:
  ollama:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      - OLLAMA_MODELS=qwen2.5:3b,qwen2.5:14b,nomic-embed-text
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: causa
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: causa
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - db_password
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U causa -d causa"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      - CAUSA_ENV=prod
      - DATABASE_URL=postgresql+psycopg2://causa:${DB_PASSWORD}@db:5432/causa
      - OLLAMA_BASE_URL=http://ollama:11434
      - MODEL_SMALL=qwen2.5:3b
      - MODEL_LARGE=qwen2.5:14b
      - MODEL_EMBEDDING=nomic-embed-text
    secrets:
      - db_password
      - backup_encryption_key
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped

  backup:
    image: alpine:latest
    volumes:
      - ./infrastructure/backups/backup_script.sh:/backup.sh:ro
      - postgres_data:/source:ro
      - ./data/backups:/target
    environment:
      - BACKUP_ENCRYPTION_KEY_FILE=/run/secrets/backup_encryption_key
    secrets:
      - backup_encryption_key
    command: ["sh", "/backup.sh"]
    restart: unless-stopped

volumes:
  ollama:
  postgres_data:

secrets:
  db_password:
    file: ./secrets/db_password
  backup_encryption_key:
    file: ./secrets/backup_encryption_key